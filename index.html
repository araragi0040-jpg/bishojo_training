<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7fb" />
  <title>ひより日和 - 育成シミュレーション v001</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LIFE SIMULATION v001</div>
        <h1>ひより日和</h1>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="メニュー">☰</button>
    </header>

    <main>
      <section class="hero-card">
        <div class="day-row">
          <span id="dayLabel">DAY 1</span>
          <span id="timeLabel" class="pill">☀ 朝</span>
        </div>

        <div class="character-stage" id="characterStage">
          <div class="room-deco deco-window"></div>
          <div class="room-deco deco-plant">🌿</div>
          <div id="character" class="character" aria-label="育成キャラクター">
            <div class="hair-back"></div>
            <div class="body">
              <div class="neck"></div>
              <div class="shirt"></div>
            </div>
            <div class="head">
              <div class="hair-front"></div>
              <div class="eye eye-left"></div>
              <div class="eye eye-right"></div>
              <div class="mouth"></div>
              <div class="blush blush-left"></div>
              <div class="blush blush-right"></div>
            </div>
          </div>
          <div class="mood-badge" id="moodBadge">😊 ごきげん</div>
        </div>

        <div class="speech-wrap">
          <div class="name-row"><strong id="charNameLabel">ひより</strong><span>20歳</span></div>
          <div id="speech" class="speech">おはよう。今日は何する？</div>
        </div>
      </section>

      <section class="quick-status">
        <div class="status-chip"><span>❤️</span><div><b id="energyText">80</b><small>元気</small></div></div>
        <div class="status-chip"><span>🍙</span><div><b id="hungerText">35</b><small>空腹</small></div></div>
        <div class="status-chip"><span>✨</span><div><b id="happinessText">65</b><small>機嫌</small></div></div>
        <div class="status-chip"><span>💤</span><div><b id="fatigueText">15</b><small>疲労</small></div></div>
      </section>

      <section class="action-panel">
        <div class="section-heading">
          <div>
            <div class="eyebrow">TODAY'S ACTION</div>
            <h2>何をする？</h2>
          </div>
          <div id="turnsLeft" class="turns-left">残り 4</div>
        </div>
        <div class="action-grid">
          <button class="action-btn" data-action="meal"><span>🍚</span><b>食事</b><small>体型・好み</small></button>
          <button class="action-btn" data-action="exercise"><span>🏃</span><b>運動</b><small>体力・筋肉</small></button>
          <button class="action-btn" data-action="study"><span>📚</span><b>勉強</b><small>知性・性格</small></button>
          <button class="action-btn" data-action="play"><span>🎮</span><b>遊ぶ</b><small>幸福・好奇心</small></button>
          <button class="action-btn" data-action="talk"><span>💬</span><b>話す</b><small>信頼・口調</small></button>
          <button class="action-btn" data-action="rest"><span>🛋️</span><b>休む</b><small>疲労回復</small></button>
        </div>
      </section>

      <section class="tabs-card">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="body">からだ</button>
          <button class="tab" data-tab="personality">性格</button>
          <button class="tab" data-tab="likes">好み</button>
          <button class="tab" data-tab="log">記録</button>
        </div>
        <div id="tabContent" class="tab-content"></div>
      </section>
    </main>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close="drawer"></div>
    <aside class="drawer-panel">
      <div class="drawer-head"><b>メニュー</b><button class="icon-btn" data-close="drawer">✕</button></div>
      <button id="renameBtn" class="menu-item">✏️ 名前を変更</button>
      <button id="newGameBtn" class="menu-item danger">↻ 新しく育てる</button>
      <div class="menu-note">データはこの端末のブラウザに自動保存されます。</div>
    </aside>
  </div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="modal"></div>
    <section class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head"><div><div class="eyebrow" id="modalEyebrow">ACTION</div><h3 id="modalTitle">選択</h3></div><button class="icon-btn" data-close="modal">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
